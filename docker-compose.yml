# Internet -> nginx:80 -> app:8000 (app port NOT exposed to the host).
services:
  app:
    build: .
    image: llm-agent-lab:latest
    restart: unless-stopped
    environment:
      # .env is read by docker compose for interpolation; secrets are
      # injected at runtime and never baked into the image.
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      DEEPSEEK_TIMEOUT_SECONDS: ${DEEPSEEK_TIMEOUT_SECONDS:-30}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      # Day 5 (OpenRouter model comparison) — optional, separate from DeepSeek.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Day 7 — persistent agent context (SQLite).
      AGENT_DB_PATH: ${AGENT_DB_PATH:-data/agents.db}
      # Day 17 — VictoriaLogs MCP tool. The base URL is required only when
      # the Day 17 tab is used; empty keeps startup (and Day 16) working.
      VICTORIA_LOGS_BASE_URL: ${VICTORIA_LOGS_BASE_URL:-}
      VICTORIA_LOGS_SERVICE_FIELD: ${VICTORIA_LOGS_SERVICE_FIELD:-service}
      VICTORIA_LOGS_TIMEOUT_SECONDS: ${VICTORIA_LOGS_TIMEOUT_SECONDS:-5}
      VICTORIA_LOGS_VERIFY_SSL: ${VICTORIA_LOGS_VERIFY_SSL:-true}
      # Optional: path to a mounted internal CA bundle (preferred over
      # VICTORIA_LOGS_VERIFY_SSL=false). Empty = use public trust store.
      VICTORIA_LOGS_CA_BUNDLE: ${VICTORIA_LOGS_CA_BUNDLE:-}
    expose:
      - "8000"
    volumes:
      # Persistent app log (host ./logs -> /app/logs); git-ignored.
      - ./logs:/app/logs
      # Persistent Agent context DB (host ./data -> /app/data); git-ignored.
      # Survives `docker compose restart` AND container recreation.
      - ./data:/app/data
      # Internal CA bundle dir (read-only) -> /certs. Defaults to ./certs;
      # override with VICTORIA_LOGS_CA_DIR to mount a host directory.
      - ${VICTORIA_LOGS_CA_DIR:-./certs}:/certs:ro
    networks:
      - appnet

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Nginx Basic Auth password file (must exist before `up`; git-ignored)
      - ./.htpasswd:/etc/nginx/.htpasswd:ro
      # Persistent nginx access/error logs (host ./logs/nginx).
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - app
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
