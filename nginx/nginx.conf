# Production Nginx configuration.
# Architecture:
#   Internet -> Nginx :80 -> Basic Auth -> rate limit -> FastAPI :8000
# The FastAPI port is only reachable inside the Docker network.

# Rate limit zone for the provider-backed endpoints (/api/chat, /api/compare):
# 5 requests/minute per client IP. Both locations share the same zone, so
# combined chat+compare traffic is bounded per IP. NOTE: one /api/compare
# request internally makes TWO DeepSeek provider calls, so a fully
# rate-limited client can spend at most ~10 provider calls/minute.
# 10m zone holds ~160k client IPs.
limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    # Persistent logs (./logs/nginx mounted at /var/log/nginx).
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # ---- Basic HTTP security headers (always -> also on 401/429 responses) ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    # Frontend is updated frequently: force revalidation so a browser never
    # runs a stale app.js/index.html after a deployment (ETag -> 304).
    add_header Cache-Control "no-cache" always;

    # The app only accepts short questions — keep request bodies small.
    client_max_body_size 16k;

    # ---- /health stays PUBLIC (uptime monitoring; exposes no sensitive data) ----
    location = /health {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ---- Chat endpoint: Basic Auth + rate limiting ----
    # Credentials come from /etc/nginx/.htpasswd (mounted read-only from
    # the host's ./.htpasswd — see docker-compose.yml). The file MUST exist.
    location = /api/chat {
        auth_basic "LLM Agent Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        # 5 requests/minute per IP, small burst, reject excess with 429.
        limit_req zone=chat_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ---- Compare endpoint: Basic Auth + rate limiting ----
    # Same zone as /api/chat. One compare request costs TWO DeepSeek calls,
    # so the shared 5 req/min per-IP cap bounds provider spend.
    location = /api/compare {
        auth_basic "LLM Agent Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=chat_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ---- Day 3 reasoning endpoint: Basic Auth + rate limiting ----
    # One reasoning request = one provider call (Method 3 uses two requests).
    # A full Day 3 comparison = up to 5 provider calls; the shared 5 req/min
    # per-IP cap bounds spend while the manual (paced) workflow stays usable.
    location = /api/reasoning {
        auth_basic "LLM Agent Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=chat_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ---- Day 4 temperature endpoint: Basic Auth + rate limiting ----
    # One request = one provider call; a full experiment = 3 calls (paced).
    location = /api/temperature {
        auth_basic "LLM Agent Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=chat_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # ---- Day 5 OpenRouter run endpoint: Basic Auth + rate limiting ----
    # One request = one paid OpenRouter call; a full comparison = 3 calls.
    location = /api/openrouter/run {
        auth_basic "LLM Agent Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        limit_req zone=chat_limit burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 200s;
    }

    # ---- Everything else (homepage, static assets): Basic Auth ----
    location / {
        auth_basic "LLM Agent Lab";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
