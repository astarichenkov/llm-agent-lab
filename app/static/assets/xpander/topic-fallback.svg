<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Mitsubishi Xpander rear view">
  <defs>
    <linearGradient id="tbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141a22"/>
      <stop offset="1" stop-color="#0a0d12"/>
    </linearGradient>
    <radialGradient id="tglow" cx="0.5" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#2b3a4f" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0a0d12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tcar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b444f"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="ttail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff1e35"/>
      <stop offset="0.5" stop-color="#e60012"/>
      <stop offset="1" stop-color="#ff1e35"/>
    </linearGradient>
    <radialGradient id="tvig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#tbg)"/>
  <rect width="640" height="400" fill="url(#tglow)"/>

  <!-- light streaks -->
  <rect x="90" y="0" width="1" height="400" fill="#ffffff" opacity="0.05"/>
  <rect x="550" y="0" width="1" height="400" fill="#ffffff" opacity="0.05"/>

  <!-- car rear silhouette -->
  <path d="M150 300 L168 210 C176 176 200 156 236 152 L404 152 C440 156 464 176 472 210 L490 300
           C494 322 480 338 456 338 L184 338 C160 338 146 322 150 300 Z"
        fill="url(#tcar)" stroke="#4a5563" stroke-width="2"/>
  <!-- rear window -->
  <path d="M206 196 L238 164 L402 164 L434 196 Z" fill="#0b0f15" opacity="0.95"/>
  <!-- tail light bars -->
  <rect x="168" y="224" width="94" height="20" rx="9" fill="url(#ttail)"/>
  <rect x="378" y="224" width="94" height="20" rx="9" fill="url(#ttail)"/>
  <!-- centre light strip -->
  <rect x="262" y="228" width="116" height="6" rx="3" fill="#e60012" opacity="0.75"/>
  <!-- plate / lower -->
  <rect x="286" y="272" width="68" height="24" rx="5" fill="#0c1016" stroke="#3a424e"/>
  <rect x="176" y="304" width="288" height="16" rx="6" fill="#10151c"/>
  <!-- wheels hints -->
  <rect x="176" y="322" width="62" height="14" rx="6" fill="#07090c"/>
  <rect x="402" y="322" width="62" height="14" rx="6" fill="#07090c"/>

  <!-- ground shadow -->
  <ellipse cx="320" cy="356" rx="220" ry="14" fill="#000" opacity="0.55"/>
  <rect width="640" height="400" fill="url(#tvig)"/>
</svg>
